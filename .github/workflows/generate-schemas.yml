name: Generate Schemas

on:
  schedule:
    - cron: '45 5 * * TUE,THU'
  workflow_dispatch:
    inputs:
      bicep_types_az_ref:
        description: 'Optional bicep-types-az commit SHA to pin. If empty, pins to latest default branch HEAD.'
        required: false
        default: ''

jobs:
  pin:
    name: Pin bicep-types-az
    runs-on: ubuntu-22.04 #Pinning the image to a specific version due to an issue with ICU packages in the latest image https://github.com/actions/runner-images/issues/10989
    outputs:
      new_sha: ${{ steps.resolve.outputs.new_sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve target SHA
        id: resolve
        run: |
          set -e
          old_sha=$(git ls-tree HEAD bicep-types-az | awk '{print $3}')
          input='${{ github.event.inputs.bicep_types_az_ref }}'
          if [ -n "$input" ]; then
            new_sha=$(git ls-remote https://github.com/Azure/bicep-types-az "$input" | cut -f1)
            # Fall back to treating the input as a raw SHA if ls-remote returns nothing.
            [ -z "$new_sha" ] && new_sha="$input"
            echo "Using requested ref '$input' -> $new_sha"
          else
            new_sha=$(git ls-remote https://github.com/Azure/bicep-types-az HEAD | cut -f1)
            echo "No ref provided; using latest default branch HEAD -> $new_sha"
          fi
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## bicep-types-az pin"
            echo "| | commit |"
            echo "|---|---|"
            echo "| before | \`$old_sha\` |"
            echo "| after  | \`$new_sha\` |"
            echo ""
            echo "Compare: https://github.com/Azure/bicep-types-az/compare/$old_sha...$new_sha"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  generate:
    needs: pin
    name: Update Schemas
    permissions:
      contents: write
    runs-on: ubuntu-22.04 #Pinning the image to a specific version due to an issue with ICU packages in the latest image https://github.com/actions/runner-images/issues/10989
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          submodules: recursive

      - name: Pin bicep-types-az to resolved SHA
        run: |
          set -e
          git -C bicep-types-az fetch --depth=1 origin '${{ needs.pin.outputs.new_sha }}'
          git -C bicep-types-az checkout '${{ needs.pin.outputs.new_sha }}'
          git -C bicep-types-az submodule update --init --recursive --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      
      - name: Install generator npm packages
        run: npm ci
        working-directory: generator

      - name: .NET Publish
        run: |
          dotnet publish

      - name: Run generator
        run: |
          set -e
          rm -f "$GITHUB_WORKSPACE/summary.log"

          npm run generate -- \
            --summary-log-path "$GITHUB_WORKSPACE/summary.log"
        working-directory: generator

      - name: Write summary
        if: ${{ always() }}
        run: cat summary.log >> $GITHUB_STEP_SUMMARY

      - name: Update resources.json
        run: |
          npm run list-resources
        working-directory: generator

      - name: Push to autogenerate branch
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Update Generated Schemas
          branch: autogenerate
          file_pattern: schemas generator/resources.json bicep-types-az
          push_options: '--force'
          create_branch: true
