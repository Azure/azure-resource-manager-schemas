name: Generate Single

on:
  workflow_dispatch:
    inputs:
      provider_namespace:
        description: 'Provider namespace in the pre-built Bicep types (e.g. "Microsoft.Compute").'
        required: true

jobs:
  update-schemas:
    name: Update Schemas
    permissions:
      contents: write
    runs-on: ubuntu-22.04 #Pinning the image to a specific version due to an issue with ICU packages in the latest image https://github.com/actions/runner-images/issues/10989

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          submodules: recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
      
      - name: Install generator npm packages
        run: npm ci
        working-directory: generator

      - name: .NET Publish
        run: dotnet publish

      - name: Run generator
        run: |
          npm run generate -- \
            --provider-namespace '${{ github.event.inputs.provider_namespace }}'
        working-directory: generator

      - name: Update resources.json
        run: |
          npm run list-resources
        working-directory: generator

      - name: Push to git branch
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Update Generated Schemas (${{ github.event.inputs.provider_namespace }})
          branch: autogenerate-single/${{ github.event.inputs.provider_namespace }}
          push_options: '--force'
          create_branch: true